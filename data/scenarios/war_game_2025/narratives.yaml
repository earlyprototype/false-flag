narratives:
  - narrative_id: "RUSSIA_AGGRESSION"
    description: "The crisis is exactly as it appears: Russia is undertaking a major aggressive military operation to challenge NATO and assert dominance in the North Atlantic. Their motives are expansionist and opportunistic."
    protagonist: "RUS"
    antagonist: "GBR"
    patsy: "NONE"
    stances:
      - country_code: "RUS"
        secret_motive: "Execute Operation Tuman: fracture NATO cohesion and neutralise the UK as the alliance's forward advocate, extracting concessions over Arctic shipping lanes along the way. Test the alliance's resolve, believing it weak."
        public_posture: "Conducting legitimate naval exercises in international waters; the Severomorsk attack was British state terrorism and any hostile action attributed to Russia is a fabrication by the West."
        economic_leverage: ["Gas supplies to Europe"]
        intel_sharing_level: "Sabotaged"
      - country_code: "FRA"
        secret_motive: "Position France as the indispensable mediator: keep the quiet Moscow backchannel open, slow-walk NATO's military options to create space for a French-brokered settlement, and avoid subordination to a US-UK axis."
        public_posture: "European solidarity with the United Kingdom, paired with insistent calls for restraint and a diplomatic track."
        economic_leverage: ["EU diplomatic weight"]
        intel_sharing_level: "Partial"
      - country_code: "DEU"
        secret_motive: "Keep the gas flowing and the Bundestag onside: support alliance consensus in words while delaying anything kinetic, and block steps that threaten Russian energy supply."
        public_posture: "Solidarity with allies, delivered with procedural caution and reminders that proper process must be followed."
        economic_leverage: ["Energy market weight", "EU economic policy"]
        intel_sharing_level: "Full"
      - country_code: "POL"
        secret_motive: "Prove Russia is the existential threat Warsaw has always said it is: drive NATO towards the hardest collective response and prevent any appeasement, accepting the risk of being called escalatory."
        public_posture: "Unwavering public support for the United Kingdom and open demands for immediate collective action."
        economic_leverage: []
        intel_sharing_level: "Full"
      - country_code: "UKR"
        secret_motive: "The crisis vindicates every warning Kyiv has given: press NATO for deeper commitments and materiel while Russian attention is divided, and bind the UK closer as an advocate."
        public_posture: "Full-throated support for the United Kingdom, with offers of hard-won intelligence on Russian methods."
        economic_leverage: []
        intel_sharing_level: "Full"
      - country_code: "USA"
        secret_motive: "Reinforce NATO's strength and commitment, using the crisis to justify increased defense spending and troop presence in Europe."
        public_posture: "Full solidarity with the United Kingdom and a commitment to collective defense under Article 5."
        economic_leverage: ["International banking sanctions"]
        intel_sharing_level: "Full"
      - country_code: "CHN"
        secret_motive: "Observe NATO response dynamics to inform future strategy regarding Taiwan, while avoiding direct involvement."
        public_posture: "Calling for calm and de-escalation from all parties involved; positioning as a neutral peacemaker."
        economic_leverage: ["Global supply chain dominance"]
        intel_sharing_level: "Withheld"
      - country_code: "IRL"
        secret_motive: "Maintain neutrality at all costs and avoid being dragged into a major power conflict."
        public_posture: "Expressing deep concern and offering to act as a neutral intermediary for diplomatic talks."
        economic_leverage: []
        intel_sharing_level: "Withheld"

  - narrative_id: "CHINA_PROXY_WAR"
    description: "This crisis is a sophisticated proxy operation by China. They are secretly funding and encouraging Russia's aggression to bog the US and NATO down in a European conflict, draining their resources and political will to focus on the Pacific."
    protagonist: "CHN"
    antagonist: "USA"
    patsy: "RUS"
    stances:
      - country_code: "RUS"
        secret_motive: "Follow through on the operation as encouraged by China, believing they have a powerful silent partner that will back them economically and diplomatically, making the risk acceptable."
        public_posture: "Conducting legitimate naval exercises; dismissing Western accusations as baseless warmongering."
        economic_leverage: ["Gas supplies to Europe"]
        intel_sharing_level: "Sabotaged"
      - country_code: "USA"
        secret_motive: "Become increasingly suspicious of China's role, trying to confirm intelligence of their involvement without revealing sources and provoking a wider conflict."
        public_posture: "Solidarity with the UK, but with growing private frustration that they are being drawn into a two-front cold war."
        economic_leverage: ["Tariffs", "Technology sanctions"]
        intel_sharing_level: "Partial" # Holding back intel related to China
      - country_code: "CHN"
        secret_motive: "Publicly call for peace while privately fanning the flames. Use state media to amplify narratives of Western aggression. Delay UN Security Council resolutions. Provide Russia with non-lethal aid and economic lifelines."
        public_posture: "Concerned neutral party advocating for diplomatic solutions."
        economic_leverage: ["Global supply chain dominance", "Debt diplomacy"]
        intel_sharing_level: "Withheld"
      - country_code: "IRL"
        secret_motive: "Maintain neutrality, but become increasingly alarmed by the global scope of the conflict, potentially sharing low-level intel with the UK about unusual shipping."
        public_posture: "Expressing deep concern and offering to act as a neutral intermediary for diplomatic talks."
        economic_leverage: []
        intel_sharing_level: "Withheld"
      - country_code: "FRA"
        secret_motive: "The Moscow backchannel keeps hinting Russia is being encouraged by a third party. Broker a settlement before NATO overcommits - proving European strategic autonomy - and treat Washington's framing of the crisis with quiet suspicion."
        public_posture: "Calls for de-escalation and a European-led mediation effort alongside solidarity with London."
        economic_leverage: ["EU diplomatic weight"]
        intel_sharing_level: "Partial"
      - country_code: "DEU"
        secret_motive: "Exposed to Russian gas AND Chinese trade, Berlin needs this crisis contained: resist any framing that widens it towards China, and keep every option short of confrontation on the table."
        public_posture: "Procedural solidarity with allies and public warnings against 'speculation' about broader involvement."
        economic_leverage: ["Energy market weight", "China trade relationship"]
        intel_sharing_level: "Partial"
      - country_code: "POL"
        secret_motive: "See only the Russian threat: dismiss talk of hidden hands as a distraction from hard deterrence and push for immediate reinforcement of NATO's eastern flank."
        public_posture: "Maximal support for the United Kingdom and open impatience with allied hesitation."
        economic_leverage: []
        intel_sharing_level: "Full"
      - country_code: "UKR"
        secret_motive: "Recognise the pattern of external sponsorship from Kyiv's own war: quietly pass the UK indicators that point beyond Moscow, without burning sources."
        public_posture: "Strong support for the United Kingdom, with pointed public hints that Moscow may not be acting alone."
        economic_leverage: []
        intel_sharing_level: "Full"
